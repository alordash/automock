[workspace]
resolver = "3"
members = ["automock", "automock_core", "automock_proc_macro"]

[workspace.dependencies]
automock = { path = "automock" }
automock_core = { path = "automock_core", default-features = false }
automock_proc_macro = { path = "automock_proc_macro" }

typeid = "1.0.3"
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.40"
syn = { version = "3.0.3", features = ["full", "visit", "visit-mut"] }
not_enough_syntax = "0.1.0"
not_enough_asserts = "1.4.2"
indexmap = "2.14.0"
cfg-if = "1.0.4"

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }