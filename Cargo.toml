[workspace]
resolver = "3"
members = ["rsubstitute", "rsubstitute_core", "rsubstitute_proc_macro"]

[workspace.dependencies]
rsubstitute_core = { path = "rsubstitute_core", version = "0.1.5", default-features = false }
rsubstitute_proc_macro = { path = "rsubstitute_proc_macro", version = "0.1.5" }

typeid = "1.0.3"
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.40"
syn = { version = "3.0.3", features = ["full", "visit", "visit-mut"] }
not_enough_syntax = "0.1.0"
not_enough_asserts = "1.4.2"
indexmap = "2.14.0"
cfg-if = "1.0.4"

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }