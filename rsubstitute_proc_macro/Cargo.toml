[package]
name = "rsubstitute_proc_macro"
version = "0.1.7"
edition = "2024"
rust-version = "1.88.0"
description = "rsubstitute procedural macros."
license = "MIT"
repository = "https://github.com/alordash/rsubstitute"
readme = "../README.md"

[lib]
name = "rsubstitute_proc_macro"
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
not_enough_syntax = { workspace = true }

[lints.clippy]
needless_return = "allow"
match_like_matches_macro = "allow"
