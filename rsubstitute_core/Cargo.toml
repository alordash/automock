[package]
name = "rsubstitute_core"
version = "0.1.6"
edition = "2024"
rust-version = "1.88.0"
description = "Core of rsubstitute that handles mocking logic."
license = "MIT"
repository = "https://github.com/alordash/rsubstitute"
readme = "../README.md"

[dependencies]
typeid = { workspace = true }
indexmap = { workspace = true }
cfg-if = { workspace = true }

[dev-dependencies]
rsubstitute = "0.1.6"

[features]
debug_naming = []

[lints.clippy]
needless_return = "allow"
match_like_matches_macro = "allow"
